<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Page</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background: #111;
            color: #fff;
            font-family: Arial, sans-serif;
            padding: 25px 15px;

            container-type: inline-size;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .tag {
            display: inline-block;
            padding: 6px 10px;
            margin-bottom: 10px;
            background: #333;
            border-radius: 20px;
            color: #aaa;
            font-size: 10px;
            letter-spacing: 1px;
        }

        h2 {
            font-size: clamp(18px, 2vw, 22px);
        }

        .menu {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .menu a {
            display: flex;
            align-items: center;
            gap: 12px;

            padding: 14px;
            color: #ccc;
            background: #1c1c1c;
            border: 1px solid #333;
            border-radius: 12px;

            text-decoration: none;
            font-size: clamp(12px, 1.2vw, 15px);

            transition: 0.2s ease;
        }

        .icon {
            display: flex;
            align-items: center;
            justify-content: center;

            min-width: 32px;
            height: 32px;

            background: #292929;
            border-radius: 8px;

            font-size: 15px;
        }

        .menu a:hover {
            background: #242424;
            border-color: #555;
            color: #fff;
            transform: translateX(3px);
        }

        .menu a:hover .icon {
            background: #333;
        }

        .menu a:active {
            transform: translateX(1px);
        }

        .footer {
            margin-top: 30px;
            text-align: center;
            color: #666;
            font-size: 10px;
            line-height: 1.5;
        }

        @container (max-width: 180px) {

            .header h2,
            .tag,
            .menu a span:not(.icon),
            .footer {
                display: none;
            }

            .header {
                margin-bottom: 20px;
            }

            .menu {
                gap: 10px;
            }

            .menu a {
                justify-content: center;
                padding: 10px;
            }

            .icon {
                min-width: 36px;
                height: 36px;
                font-size: 17px;
            }
        }
    </style>
</head>

<body>

    <header class="header">

        <span class="tag">NAVIGATION</span>

        <h2>HTML Frames</h2>

    </header>


    <nav class="menu">

        <a href="home.html" target="content">
            <span class="icon">⌂</span>
            <span>Home</span>
        </a>

        <a href="frame.html" target="content">
            <span class="icon">▣</span>
            <span>About Frames</span>
        </a>

        <a href="examples.html" target="content">
            <span class="icon">◇</span>
            <span>Examples</span>
        </a>

    </nav>


    <div class="footer">
        Select a page to view it<br>
        in the content area.
    </div>

</body>
</html>
